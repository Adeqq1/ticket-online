name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production API image
        run: docker build -f backend/Dockerfile -t ticket-online-api:ci .

      - name: Build frontend development image
        run: docker build -f frontend/Dockerfile -t ticket-online-frontend:ci frontend

      - name: Validate Compose configuration
        run: docker compose config
