name: Frontend

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Build frontend
        run: bun run build

      - name: Verify SPA fallback
        run: test -f dist/_redirects && grep -Fq '/* /index.html 200' dist/_redirects
