name: Backend

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ticket_online
          MYSQL_USER: ticket
          MYSQL_PASSWORD: ticket
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
    env:
      MYSQL_DSN: ticket:ticket@tcp(127.0.0.1:3306)/ticket_online?parseTime=true&loc=UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Generate ephemeral CI order secret
        run: echo "ORDER_ACCESS_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run migrations
        run: go run ./cmd/migrate

      - name: Run tests
        run: MYSQL_TEST_DSN="$MYSQL_DSN" go test -v ./...

      - name: Run vet
        run: go vet ./...

      - name: Build API and migration binaries
        run: go build ./cmd/api ./cmd/migrate
