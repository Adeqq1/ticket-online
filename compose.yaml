services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ticket_online
      MYSQL_USER: ticket
      MYSQL_PASSWORD: ticket
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MYSQL_DSN: ticket:ticket@tcp(db:3306)/ticket_online?parseTime=true&loc=UTC
      HTTP_ADDR: :8080
      STATIC_DIR: /app/public
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  mysql_data:
