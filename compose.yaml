services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ticket_online
      MYSQL_USER: ticket
      MYSQL_PASSWORD: ticket
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "127.0.0.1:8000:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MYSQL_DSN: ticket:ticket@tcp(db:3306)/ticket_online?parseTime=true&loc=UTC
      APP_ENV: ${APP_ENV:-production}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-sandbox}
      ORDER_ACCESS_SECRET: ${ORDER_ACCESS_SECRET:?Set ORDER_ACCESS_SECRET to base64 of 32 random bytes}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      TRANSACTIONS_ENABLED: ${TRANSACTIONS_ENABLED:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.18.3/32}
      HTTP_ADDR: :8080
      STATIC_DIR: /app/public
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
      VITE_ENABLE_PAYMENT_SIMULATION: ${VITE_ENABLE_PAYMENT_SIMULATION:-false}
    ports:
      - "5173:5173"
    networks:
      default:
        ipv4_address: 172.30.18.3
    depends_on:
      api:
        condition: service_started

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.18.0/24

volumes:
  mysql_data:
